# Regenera cada día las páginas de inmuebles y de categorías (SEO/AEO), el sitemap y llms.txt, y las sube si hubo cambios.
# Costo: ~1 minuto por ejecución; entra de sobra en los 2.000 min/mes del plan gratuito.
name: Páginas de inmuebles

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = 05:00 en Bolivia
  workflow_dispatch:       # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: inmuebles
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar páginas
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/gen_property_pages.py
      - name: Probar las páginas generadas
        run: python tests/seo_pages_test.py
      - name: Subir cambios si los hay
        id: push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            python tools/indexnow.py --diff-head "$RUNNER_TEMP/indexnow-urls.json"
            git config user.name "bastet-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Inmuebles: páginas y sitemap actualizados automáticamente"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin cambios."
          fi
      - name: Avisar a Bing (IndexNow)
        if: steps.push.outputs.changed == 'true'
        run: |
          sleep 120   # espera a que Hostinger publique los cambios
          python tools/indexnow.py --submit "$RUNNER_TEMP/indexnow-urls.json" || echo "IndexNow no respondió; no afecta al sitio."
